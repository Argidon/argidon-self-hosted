version: "3.9"

# wind-importer Swarm Jobs — Python + GDAL, wind/ocean/atmosphere forecast
# layers. 36 independent Job services, one per data source (schedule
# matches PLAN.md §3's job schedule table) — no grouping, each with its own
# swarm-cronjob label.
#
# All commands run against ghcr.io/argidon/mhews-wind-importer:latest, built
# from wind-importer/Dockerfile and pushed to GHCR by
# .github/workflows/docker-build-wind-importer.yml, and all pass `--once`
# (main.py without it loops forever in-process — wrong for a Job, which
# must run to completion and exit).
#
# `S` in the comments below = each GFS cycle start (00:00 / 06:00 / 12:00 /
# 18:00 UTC, 4x daily) — see PLAN.md §3 for how each offset was derived.
# swarm-cronjob labels use its 6-field cron format (seconds first):
# sec min hour day-of-month month day-of-week.

x-wind-job: &wind-job
  image: ghcr.io/argidon/mhews-wind-importer:latest
  networks:
    - mhews
  # env_file:
  #   - ../env/.env

x-wind-job-deploy: &wind-job-deploy
  mode: replicated-job
  restart_policy:
    condition: on-failure
    max_attempts: 3

services:
  # Forecast tier first (heaviest/longest-running — each loops over many
  # variables/steps internally — so a slow run has the most runway before
  # its own next 6h trigger).
  #
  # swarm-cronjob reads labels from `deploy.labels` — a Swarm SERVICE's
  # labels, not a container's top-level `labels:` — since that's what
  # `docker service inspect`/the Docker API expose to label-watching tools
  # like swarm-cronjob.
  forecast-15d-importer:
    <<: *wind-job
    command: ["--forecast-horizon=15d", "--once"]
    deploy:
      <<: *wind-job-deploy
      labels:
        swarm.cronjob.enable: "true"
        swarm.cronjob.schedule: "0 5 0,6,12,18 * * *" # S+5m
        swarm.cronjob.skip-running: "true"

  forecast-1mo-importer:
    <<: *wind-job
    command: ["--forecast-horizon=1mo", "--once"]
    deploy:
      <<: *wind-job-deploy
      labels:
        swarm.cronjob.enable: "true"
        swarm.cronjob.schedule: "0 15 0,6,12,18 * * *" # S+15m
        swarm.cronjob.skip-running: "true"

  forecast-3mo-importer:
    <<: *wind-job
    command: ["--forecast-horizon=3mo", "--once"]
    deploy:
      <<: *wind-job-deploy
      labels:
        swarm.cronjob.enable: "true"
        swarm.cronjob.schedule: "0 25 0,6,12,18 * * *" # S+25m
        swarm.cronjob.skip-running: "true"

  # Flow layers (Animate: Wind/Currents/Waves).
  wind-importer:
    <<: *wind-job
    command: ["--layer-type=wind", "--once"]
    deploy:
      <<: *wind-job-deploy
      labels:
        swarm.cronjob.enable: "true"
        swarm.cronjob.schedule: "0 35 0,6,12,18 * * *" # S+35m
        swarm.cronjob.skip-running: "true"

  wind-levels-importer:
    <<: *wind-job
    command: ["--layer-type=wind", "--levels=1000,850,700,500,250,70,10", "--once"]
    deploy:
      <<: *wind-job-deploy
      labels:
        swarm.cronjob.enable: "true"
        swarm.cronjob.schedule: "0 45 0,6,12,18 * * *" # S+45m
        swarm.cronjob.skip-running: "true"

  currents-importer:
    <<: *wind-job
    command: ["--layer-type=ocean_current", "--once"]
    deploy:
      <<: *wind-job-deploy
      labels:
        swarm.cronjob.enable: "true"
        swarm.cronjob.schedule: "0 55 0,6,12,18 * * *" # S+55m
        swarm.cronjob.skip-running: "true"

  waves-importer:
    <<: *wind-job
    command: ["--layer-type=wave", "--once"]
    deploy:
      <<: *wind-job-deploy
      labels:
        swarm.cronjob.enable: "true"
