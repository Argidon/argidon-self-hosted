version: "3.9"

x-backup-image: &backup-image
  image: ghcr.io/argidon/mhews-backup:latest
  networks:
    - mhews
  secrets:
    - POSTGRES_PASSWORD
    - source: RCLONE_CONF
      target: /root/.config/rclone/rclone.conf
  environment:
    - DB_HOST=${DB_HOST:-supabase-db}
    - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    - POSTGRES_DB=${POSTGRES_DB:-postgres}
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - BACKUP_TARGET=${BACKUP_TARGET}
    - RETENTION_DAILY=${RETENTION_DAILY:-7}
    - RETENTION_WEEKLY=${RETENTION_WEEKLY:-4}
    - RETENTION_MONTHLY=${RETENTION_MONTHLY:-6}
    - HEALTHCHECKS_PING_URL=${HEALTHCHECKS_PING_URL:-}
    - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-http://pushgateway:9091}

x-backup-job-deploy: &backup-job-deploy
  mode: replicated-job
  placement:
    constraints:
      - node.role == manager

services:
  backup:
    <<: *backup-image
    command: ["./backup.sh"]
    volumes:
      - ${SUPABASE_DIR}/volumes:/supabase-volumes:ro
    deploy:
      <<: *backup-job-deploy
      restart_policy:
        condition: on-failure
        max_attempts: 3
      labels:
        swarm.cronjob.enable: "true"
        swarm.cronjob.schedule: "0 0 1 * * *" # daily, 01:00 UTC — see ../../backups/README.md's Schedule
        swarm.cronjob.skip-running: "true"

  restore:
    <<: *backup-image
    # Manual-only (no swarm.cronjob label) — matching raster-importer-jobs.yml's
    # meta-downloader convention. DESTRUCTIVE — see restore.sh's own header.
    # Edit the tier/timestamp args and re-deploy, or override at trigger
    # time, e.g.:
    #   docker service update --force --env-add CONFIRM=yes mhews_restore
    command: ["./restore.sh", "daily"]
    volumes:
      - ${SUPABASE_DIR}/volumes:/supabase-volumes
    deploy:
      <<: *backup-job-deploy
      restart_policy:
        condition: none

networks:
  mhews:
    external: true
    name: mhews

secrets:
  POSTGRES_PASSWORD:
    external: true
  RCLONE_CONF:
    external: true
